services:
  - type: web
    name: study-planner
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/render_start.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: braindumpdb_dopv
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: SEED_DEFAULT_USERS_PRODUCTION
        value: "false"
      - key: MIGRATION_MAX_RETRIES
        value: "6"
      - key: MIGRATION_RETRY_SECONDS
        value: "5"

databases:
  - name: braindumpdb_dopv
