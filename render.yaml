services:
  - type: web
    name: study-planner
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m flask --app run.py db upgrade && python -m gunicorn run:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FLASK_ENV
        value: production
