services:
  - type: web
    name: study-planner
    env: python
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn run:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: studyplanner-db
          property: connectionString
      - key: FLASK_ENV
        value: production

databases:
  - name: studyplanner-db
    databaseName: study_planner
    user: study_planner
