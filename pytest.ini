[pytest]
# pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Ignore patterns
norecursedirs = .git .tox dist build *.egg venv migrations

# Coverage options
[coverage:run]
omit = 
    */tests/*
    */migrations/*
    */venv/*
    */__pycache__/*
    */config.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
